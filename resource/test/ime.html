<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <title>IME Example</title>
    <style>
      body {
        background-color: #f4f6f8;
        color: #20242a;
        font-family: sans-serif;
        margin: 24px;
      }

      h1 {
        font-size: 26px;
        margin-bottom: 12px;
      }

      p {
        margin-bottom: 20px;
      }

      input {
        border: 1px solid #8b95a1;
        display: block;
        font-size: 20px;
        height: 38px;
        margin-bottom: 18px;
        padding: 4px 8px;
        width: 420px;
      }
    </style>
  </head>
  <body>
    <h1>IME text input</h1>
    <p>テキストボックスをクリックして、日本語を入力してください。</p>
    <input value="あいうえお" placeholder="日本語を入力">
    <input placeholder="うんち！！！">
  </body>
</html>
