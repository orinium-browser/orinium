<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Image Example</title>
    <style>
      body {
        background-color: #f4f6f8;
        color: #20242a;
        font-family: sans-serif;
        margin: 24px;
      }

      h1 {
        font-size: 28px;
        margin-bottom: 24px;
      }

      .card {
        background-color: white;
        border: 1px solid #d8dde3;
        margin-bottom: 20px;
        padding: 16px;
      }

      .card h2 {
        font-size: 18px;
        margin: 0 0 12px;
      }

      .icon {
        height: 128px;
        width: 128px;
      }

      .test-image {
        height: 208px;
        width: 360px;
      }
    </style>
  </head>
  <body>
    <h1>HTML image rendering</h1>

    <div class="card">
      <h2>resource/icon.png</h2>
      <img class="icon" src="resource:///icon.png" alt="Orinium icon">
    </div>

    <div class="card">
      <h2>resource/images/test.png</h2>
      <img class="test-image" src="resource:///images/test.png" alt="Test image">
    </div>
  </body>
</html>
