[package]
name = "orinium_browser"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace]
resolver = "3"

[dependencies]
dhat = "0.3.3"

anyhow = "1.0"
tokio = { version = "1.52", features = ["rt", "net", "time", "io-std", "fs"] }
pollster = "0.4"
env_logger = "0.11.10"
log = "0.4.29"
once_cell = "1.21.4"
entities = "1.0.1"
winit = "0.30.13"
wgpu = "29.0.1"
wgpu-types = "29.0.1"
glyphon = "0.11.0"
fontdue = "0.9.3"
ab_glyph = "0.2"
bytemuck = { version = "1.25", features = ["derive"] }
url = "2.5"
rustls = { version = "0.23.40", default-features = false, features = ["tls12"] }
rustls-native-certs = "0.8.3"
tokio-rustls = "0.26.4"
hyper = { version = "1", features = ["client", "http1", "http2"] }
http-body-util = "0.1"
hyper-util = { version = "0.1", features = ["tokio"] }
image = "0.25.10"
ui_layout = "0.9.8"
cpal = "0.17.3"
symphonia = { version = "0.6.0", features = ["aac", "flac", "mp3", "vorbis", "wav"] }
smol_str = "0.3.6"


[dev-dependencies]
colored = "3.1.1" # コマンドラインハイライト用
strsim = "0.11.1"

[features]
dhat-heap = []
